<header class="docs-navbar">
  <nav class="docs-navbar__header" aria-label="Top Toolbar">
    <a class="docs-navbar__brand" href="/" aria-label="Workspace design system home">
      <span class="docs-logo" aria-hidden="true">W</span>
      <span>Workspace</span>
    </a>
    <pb-button href="/" class="docs-navbar__hide-small docs-navbar__item--selected">Components</pb-button>

    <div class="docs-flex-spacer"></div>

    <div class="docs-theme-picker" pbTooltip="Select a theme for the documentation">
      <pb-menu triggerVariant="icon" triggerIcon="format_color_fill" aria-label="Select a theme" xPosition="before"
               panelClass="theme-picker">
        @for (theme of options; track theme.key) {
          <pb-menu-item [icon]="themes.theme() === theme.key ? 'radio_button_checked' : 'radio_button_unchecked'"
                        (selected)="select(theme.key)">
            <span class="theme-picker__item">
              {{ theme.name }}
              <!-- The svg carries data-theme, so its fills come from that theme's own tokens. -->
              <span class="theme-example" aria-hidden="true">
                <svg class="theme-example__svg" [class.theme-example__svg--dark]="theme.dark" [attr.data-theme]="theme.key"
                     viewBox="0 0 80 80" focusable="false">
                  <path class="theme-example__background" d="M77.87 0C79.05 0 80 .95 80 2.13v75.74c0 1.17-.95 2.13-2.13 2.13H2.13C.96 80 0 79.04 0 77.87V2.13C0 .95.96 0 2.13 0h75.74z" />
                  <path class="theme-example__accent" d="M54 40c3.32 0 6 2.69 6 6 0 1.2 0-1.2 0 0 0 3.31-2.68 6-6 6H26c-3.31 0-6-2.69-6-6 0-1.2 0 1.2 0 0 0-3.31 2.69-6 6-6h28z" />
                  <path class="theme-example__accent" d="M0 0h80v17.24H0V0z" />
                </svg>
              </span>
            </span>
          </pb-menu-item>
        }
      </pb-menu>
    </div>
  </nav>
</header>
