<div class="catalog-content">
  <docs-page-header title="Toolbar">
    pb-toolbar is a container for headers, titles or actions, in one or more rows.
  </docs-page-header>

  <section class="doc-section">
    <docs-example title="Toolbar overview" page="toolbar" id="overview">
      <pb-toolbar>
        <pb-button variant="icon" icon="menu" aria-label="Menu" />
        <span>My App</span>
        <span class="docs-flex-spacer"></span>
        <pb-button variant="icon" icon="favorite" aria-label="Favorite" />
        <pb-button variant="icon" icon="share" aria-label="Share" />
      </pb-toolbar>
    </docs-example>

    <docs-example title="Multi-row toolbar" page="toolbar" id="multi-row">
      <pb-toolbar>
        <span>Custom toolbar</span>
      </pb-toolbar>
      <pb-toolbar>
        <span>Second line</span>
        <span class="docs-flex-spacer"></span>
        <pb-button variant="icon" icon="verified_user" aria-label="Verified" />
      </pb-toolbar>
    </docs-example>
  </section>
</div>
