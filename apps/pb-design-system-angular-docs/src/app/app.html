<ng-template #navigation>
  <pb-list class="docs-nav__list">
    @for (item of catalog; track item.path) {
      <pb-list-item [href]="'/' + item.path" [title]="item.name" [selected]="path() === '/' + item.path" />
    }
  </pb-list>
</ng-template>

<div class="docs-app">
  <docs-top-app-bar />

  <div class="docs-body">
    <nav class="docs-nav" aria-label="Components">
      <ng-container [ngTemplateOutlet]="navigation" />
    </nav>

    <main class="page-shell">
      <header class="docs-page-header">
        <pb-button iconStart="menu" (click)="drawerOpen.set(true)">Menu</pb-button>
      </header>
      <router-outlet />
    </main>
  </div>

  <pb-sidenav class="docs-drawer" mode="over" [(opened)]="drawerOpen">
    <nav pbSidenavPanel class="docs-drawer__nav" aria-label="Components">
      <ng-container [ngTemplateOutlet]="navigation" />
    </nav>
  </pb-sidenav>
</div>
