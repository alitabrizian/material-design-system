<div class="catalog-content">
  <docs-page-header title="Progress Bar">
    A progress bar communicates the completion of an operation: determinate, indeterminate, or buffered.
  </docs-page-header>

  <section class="doc-section">
    <docs-example title="Determinate" page="progress-bar" id="determinate">
      <pb-progress-bar [value]="progress()" />
      <pb-slider [(value)]="progress" discrete style="max-width: 320px" />
    </docs-example>

    <docs-example title="Indeterminate" page="progress-bar" id="indeterminate">
      <pb-progress-bar indeterminate />
    </docs-example>

    <docs-example title="Buffered" page="progress-bar" id="buffer">
      <pb-progress-bar [value]="40" [bufferValue]="70" />
    </docs-example>
  </section>

  <section class="doc-section">
    <h2>API reference</h2>
    <div class="doc-table-wrapper">
      <table class="doc-table">
        <thead><tr><th>Input</th><th>Type</th><th>Description</th></tr></thead>
        <tbody>
          <tr><td><code>value</code></td><td><code>number</code></td><td>Progress from 0 to 100.</td></tr>
          <tr><td><code>indeterminate</code></td><td><code>boolean</code></td><td>Animates without a known value.</td></tr>
          <tr><td><code>bufferValue</code></td><td><code>number</code></td><td>Shows the buffer track up to this value.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
