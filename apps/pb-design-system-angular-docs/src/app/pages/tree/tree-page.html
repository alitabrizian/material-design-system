<div class="catalog-content">
  <docs-page-header title="Tree">
    pb-tree displays hierarchical data: expandable nodes with a toggle button and indentation per level.
  </docs-page-header>

  <section class="doc-section">
    <docs-example title="Nested tree" page="tree" id="nested">
      <pb-tree [nodes]="food" />
    </docs-example>

    <docs-example title="Tree with icons" page="tree" id="icons">
      <pb-tree [nodes]="files" />
    </docs-example>
  </section>

  <section class="doc-section">
    <h2>API reference</h2>
    <div class="doc-table-wrapper">
      <table class="doc-table">
        <thead><tr><th>Input</th><th>Type</th><th>Description</th></tr></thead>
        <tbody>
          <tr><td><code>nodes</code></td><td><code>PbTreeNode[]</code></td><td>The tree: each node has a <code>label</code>, an optional <code>icon</code> and optional <code>children</code>.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
