<mat-radio-group
  [class.pb-radio-group--vertical]="vertical()"
  [value]="value()"
  [disabled]="isDisabled()"
  (change)="select($event)"
>
  @for (option of options(); track option) {
    <mat-radio-button [value]="option.value()" [disabled]="option.disabled()">
      <ng-container [ngTemplateOutlet]="option.template()" />
    </mat-radio-button>
  }
</mat-radio-group>
