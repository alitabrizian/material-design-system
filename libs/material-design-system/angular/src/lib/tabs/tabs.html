<mat-tab-group [(selectedIndex)]="selectedIndex" [mat-stretch-tabs]="stretch()" [mat-align-tabs]="align()">
  @for (tab of tabs(); track tab) {
    <mat-tab [disabled]="tab.disabled()">
      <ng-template mat-tab-label>
        @if (tab.icon(); as name) { <mat-icon class="pb-tab__icon">{{ name }}</mat-icon> }
        {{ tab.label() }}
      </ng-template>
      <ng-container [ngTemplateOutlet]="tab.template()" />
    </mat-tab>
  }
</mat-tab-group>
