<mat-form-field [appearance]="appearance()">
  @if (label(); as text) {
    <mat-label>{{ text }}</mat-label>
  }
  <input
    matInput
    [matAutocomplete]="panel"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="isDisabled()"
    [errorStateMatcher]="errorStateMatcher"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />
  <mat-autocomplete
    #panel="matAutocomplete"
    [autoActiveFirstOption]="autoActiveFirstOption()"
    [requireSelection]="requireSelection()"
    (optionSelected)="update($event.option.value)"
  >
    @for (option of suggestions(); track option) {
      <mat-option [value]="option.value()" [disabled]="option.disabled()">
        <ng-container [ngTemplateOutlet]="option.template()" />
      </mat-option>
    }
  </mat-autocomplete>
  @if (errorText(); as text) {
    <mat-error>{{ text }}</mat-error>
  } @else if (supportingText(); as text) {
    <mat-hint>{{ text }}</mat-hint>
  }
</mat-form-field>
